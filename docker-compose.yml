x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    container_name: medical-backend
    ports:
      # Localhost only; browsers reach the API through the frontend's nginx proxy
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: medical-frontend
    ports:
      - "6363:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./backend
    container_name: medical-worker
    command: python worker.py
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  bot:
    build: ./backend
    container_name: medical-bot
    command: python bot.py
    env_file:
      - .env
    restart: unless-stopped
    logging: *default-logging

volumes:
  uploads_data:
